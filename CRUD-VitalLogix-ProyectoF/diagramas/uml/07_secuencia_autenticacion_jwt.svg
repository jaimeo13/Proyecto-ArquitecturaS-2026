<svg xmlns="http://www.w3.org/2000/svg" width="1253" height="783" viewBox="0 0 1253 783">
<defs>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .title { font-size: 18px; font-weight: 700; fill: #0f172a; }
    .sub { font-size: 11.5px; fill: #475569; }
    .actor { font-size: 12px; font-weight: 700; fill: #ffffff; }
    .actorSub { font-size: 10px; fill: #dbeafe; }
    .msg { font-size: 11.5px; font-weight: 600; fill: #0f172a; }
    .ret { font-size: 11px; fill: #475569; font-style: italic; }
    .altlbl { font-size: 11px; font-weight: 700; fill: #991b1b; }
  </style>
  <marker id="syncArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
    <path d="M 0 1 L 10 5 L 0 9 Z" fill="#1e3a8a"/>
  </marker>
  <marker id="retArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
    <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#475569" stroke-width="1.6"/>
  </marker>
  <marker id="errArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
    <path d="M 0 1 L 10 5 L 0 9 Z" fill="#dc2626"/>
  </marker>
</defs>
<rect width="1253" height="783" fill="#ffffff"/>
<rect x="12" y="12" width="1229" height="759" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="34" y="44" class="title">Diagrama de Secuencia 5 — Manejo de Sesiones y Autenticación JWT</text>
<text x="34" y="64" class="sub">Inicio de sesión de administrador desde la ventana flotante AuthModal para habilitar operaciones de escritura CRUD</text>
<rect x="34" y="411" width="1185" height="220" rx="6" fill="#ecfdf5" fill-opacity="0.55" stroke="#15803d" stroke-width="1.5" stroke-dasharray="6,3"/>
<rect x="34" y="411" width="50" height="19" fill="#15803d"/>
<text x="59" y="424" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">alt</text>
<rect x="90" y="412" width="150.0" height="17" rx="3" fill="#ffffff" fill-opacity="0.85"/>
<text x="98" y="424" font-size="10.8" font-weight="700" fill="#15803d">[Credenciales válidas]</text>
<rect x="34" y="619" width="1185" height="64" rx="6" fill="#fef2f2" fill-opacity="0.55" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6,3"/>
<rect x="34" y="619" width="50" height="19" fill="#dc2626"/>
<text x="59" y="632" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">alt</text>
<rect x="90" y="620" width="202.79999999999998" height="17" rx="3" fill="#ffffff" fill-opacity="0.85"/>
<text x="98" y="632" font-size="10.8" font-weight="700" fill="#dc2626">[Credenciales inválidas (401)]</text>
<line x1="176" y1="141" x2="176" y2="747" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,5"/>
<rect x="83" y="95" width="186" height="46" rx="6" fill="#334155"/>
<text x="176" y="115" text-anchor="middle" class="actor">Usuario</text>
<text x="176" y="131" text-anchor="middle" class="actorSub">Navegador Web</text>
<line x1="401" y1="141" x2="401" y2="747" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,5"/>
<rect x="308" y="95" width="186" height="46" rx="6" fill="#1d4ed8"/>
<text x="401" y="115" text-anchor="middle" class="actor">RootApp / AuthModal</text>
<text x="401" y="131" text-anchor="middle" class="actorSub">React SPA</text>
<line x1="626" y1="141" x2="626" y2="747" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,5"/>
<rect x="533" y="95" width="186" height="46" rx="6" fill="#15803d"/>
<text x="626" y="115" text-anchor="middle" class="actor">AuthController</text>
<text x="626" y="131" text-anchor="middle" class="actorSub">REST API</text>
<line x1="851" y1="141" x2="851" y2="747" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,5"/>
<rect x="758" y="95" width="186" height="46" rx="6" fill="#b45309"/>
<text x="851" y="115" text-anchor="middle" class="actor">UserRepository</text>
<text x="851" y="131" text-anchor="middle" class="actorSub">MySQL users</text>
<line x1="1076" y1="141" x2="1076" y2="747" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,5"/>
<rect x="983" y="95" width="186" height="46" rx="6" fill="#0f766e"/>
<text x="1076" y="115" text-anchor="middle" class="actor">JwtService</text>
<text x="1076" y="131" text-anchor="middle" class="actorSub">HS256 Token</text>
<rect x="396" y="177" width="10" height="24" rx="2" fill="#bfdbfe" stroke="#2563eb" stroke-width="1"/>
<line x1="176" y1="187" x2="401" y2="187" stroke="#1e3a8a" stroke-width="1.8" marker-end="url(#syncArrow)"/>
<rect x="124.4" y="167" width="328.2" height="16" rx="3" fill="#ffffff" fill-opacity="0.88"/>
<text x="288.5" y="179" text-anchor="middle" class="msg">1. Clic en &#x27;Iniciar sesión&#x27; o acción CRUD protegida</text>
<rect x="621" y="229" width="10" height="24" rx="2" fill="#bfdbfe" stroke="#2563eb" stroke-width="1"/>
<line x1="401" y1="239" x2="626" y2="239" stroke="#1e3a8a" stroke-width="1.8" marker-end="url(#syncArrow)"/>
<rect x="364.9" y="219" width="297.2" height="16" rx="3" fill="#ffffff" fill-opacity="0.88"/>
<text x="513.5" y="231" text-anchor="middle" class="msg">2. POST /api/auth/login { username, password }</text>
<rect x="846" y="281" width="10" height="24" rx="2" fill="#bfdbfe" stroke="#2563eb" stroke-width="1"/>
<line x1="626" y1="291" x2="851" y2="291" stroke="#1e3a8a" stroke-width="1.8" marker-end="url(#syncArrow)"/>
<rect x="617.8" y="271" width="241.4" height="16" rx="3" fill="#ffffff" fill-opacity="0.88"/>
<text x="738.5" y="283" text-anchor="middle" class="msg">3. findByNormalizedUsername(username)</text>
<rect x="621" y="333" width="10" height="24" rx="2" fill="#bfdbfe" stroke="#2563eb" stroke-width="1"/>
<line x1="851" y1="343" x2="626" y2="343" stroke="#475569" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#retArrow)"/>
<rect x="624.0" y="323" width="229.0" height="16" rx="3" fill="#ffffff" fill-opacity="0.88"/>
<text x="738.5" y="335" text-anchor="middle" class="ret">4. User con hash BCrypt y Set&lt;Role&gt;</text>
<path d="M 626 387 L 672 387 L 672 405 L 630 405" fill="none" stroke="#1e3a8a" stroke-width="1.7" marker-end="url(#syncArrow)"/>
<rect x="676" y="386" width="276.59999999999997" height="18" rx="3" fill="#ffffff" fill-opacity="0.9"/>
<text x="680" y="399" class="msg">5. passwordEncoder.matches(password, hash)</text>
<rect x="1071" y="437" width="10" height="24" rx="2" fill="#bfdbfe" stroke="#2563eb" stroke-width="1"/>
<line x1="626" y1="447" x2="1076" y2="447" stroke="#1e3a8a" stroke-width="1.8" marker-end="url(#syncArrow)"/>
<rect x="755.1" y="427" width="191.8" height="16" rx="3" fill="#ffffff" fill-opacity="0.88"/>
<text x="851.0" y="439" text-anchor="middle" class="msg">6. generateToken(userDetails)</text>
<rect x="621" y="489" width="10" height="24" rx="2" fill="#bfdbfe" stroke="#2563eb" stroke-width="1"/>
<line x1="1076" y1="499" x2="626" y2="499" stroke="#475569" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#retArrow)"/>
<rect x="717.9" y="479" width="266.20000000000005" height="16" rx="3" fill="#ffffff" fill-opacity="0.88"/>
<text x="851.0" y="491" text-anchor="middle" class="ret">7. Token JWT firmado (expira en 10 horas)</text>
<rect x="396" y="541" width="10" height="24" rx="2" fill="#bfdbfe" stroke="#2563eb" stroke-width="1"/>
<line x1="626" y1="551" x2="401" y2="551" stroke="#475569" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#retArrow)"/>
<rect x="377.29999999999995" y="531" width="272.40000000000003" height="16" rx="3" fill="#ffffff" fill-opacity="0.88"/>
<text x="513.5" y="543" text-anchor="middle" class="ret">8. HTTP 200 OK { token, roles: [&#x27;ADMIN&#x27;] }</text>
<rect x="171" y="593" width="10" height="24" rx="2" fill="#bfdbfe" stroke="#2563eb" stroke-width="1"/>
<line x1="401" y1="603" x2="176" y2="603" stroke="#475569" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#retArrow)"/>
<rect x="108.9" y="583" width="359.2" height="16" rx="3" fill="#ffffff" fill-opacity="0.88"/>
<text x="288.5" y="595" text-anchor="middle" class="ret">9. Guarda token en localStorage y habilita CRUD completo</text>
<rect x="396" y="645" width="10" height="24" rx="2" fill="#bfdbfe" stroke="#2563eb" stroke-width="1"/>
<line x1="626" y1="655" x2="401" y2="655" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#errArrow)"/>
<rect x="340.1" y="635" width="346.8" height="16" rx="3" fill="#ffffff" fill-opacity="0.88"/>
<text x="513.5" y="647" text-anchor="middle" class="altlbl">10. Si credenciales inválidas -&gt; HTTP 401 Unauthorized</text>
</svg>